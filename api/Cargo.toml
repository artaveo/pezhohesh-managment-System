[package]
name = "pezhohesh-api"
version = "0.20.0"
edition = "2021"
description = "Core API for the Pezhohesh management system (study hall + educational services)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "fs", "net", "time", "sync", "io-util"] }
url = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
argon2 = "0.5"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
calamine = "0.37"
office-crypto = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Ioctl"] }

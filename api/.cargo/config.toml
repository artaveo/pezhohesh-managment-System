# The API runs as a sidecar on office computers that may not have the Visual C++
# runtime installed, so link the C runtime statically into pezhohesh-api.exe.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
